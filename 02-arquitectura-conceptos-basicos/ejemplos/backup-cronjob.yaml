apiVersion: batch/v1
kind: CronJob
metadata:
  name: sistema-backup
spec:
  schedule: "*/1 * * * *" # Expresión cron para "cada minuto"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: alpine
            command: ["sh", "-c", "echo 'Backup diario ejecutado a las $(date)'"]
          restartPolicy: OnFailure
